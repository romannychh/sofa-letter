<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Письмо для Софы</title>
<style>html,body{margin:0;background:#fbf7f3}</style>
</head>
<body>
<script>
  // Telegram кэширует страницу, поэтому письмо всегда подгружаем свежим
  fetch('letter.html?t=' + Date.now(), { cache: 'no-store' })
    .then(r => r.text())
    .then(html => { document.open(); document.write(html); document.close(); })
    .catch(() => { location.replace('letter.html?t=' + Date.now()); });
</script>
</body>
</html>
